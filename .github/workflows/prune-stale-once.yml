name: prune-stale-once
on:
  push:
    paths:
      - .github/workflows/prune-stale-once.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete stale branches and self-remove
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          delete_ref() {
            local branch="$1"
            echo "Deleting refs/heads/${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              && echo "deleted ${branch}" \
              || echo "skip ${branch} (already gone or denied)"
          }
          delete_ref "master"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/prune-stale-once.yml
          git commit -m "chore: remove one-shot prune workflow"
          git push
